{% include base_path %}
<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  {% include seo.html %}

  <link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png"/>
  <link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg"/>
  <link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png" sizes="32x32"/>
  <link rel="icon" href="{{ base_path }}/images/favicon.ico"/>
  <meta name="theme-color" content="#0a0c16"/>

  <link rel="stylesheet" href="{{ base_path }}/assets/css/style.css">
</head>
<body>

  <canvas id="stellar-bg" aria-hidden="true"></canvas>

  <header class="site-header">
    <a class="site-title" href="{{ base_path }}/">{{ site.author.name }}</a>
    <nav class="site-nav">
      <a href="{{ base_path }}/"{% if page.url == "/" %} class="active"{% endif %}>Home</a>
      {% for link in site.data.navigation.main %}<a href="{{ link.url | relative_url }}"{% if page.url == link.url %} class="active"{% endif %}>{{ link.title }}</a>{% endfor %}
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <p>
      <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a>
      &middot; <a href="https://github.com/{{ site.author.github }}">GitHub</a>
      &middot; <a href="{{ site.author.googlescholar }}">Google Scholar</a>
      &middot; <a href="{{ site.author.arxiv }}">arXiv</a>
      &middot; Last updated {{ "now" | date: "%Y-%m-%d" }}
    </p>
  </footer>

  <div class="modal-backdrop" id="note-modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="note-modal-title">
      <button type="button" class="modal-close" aria-label="Close">&times;</button>
      <h3 id="note-modal-title"></h3>
      <p id="note-modal-desc"></p>
      <a class="btn" id="note-modal-link" href="#">View Notes</a>
    </div>
  </div>

  <script>
    (function () {
      var backdrop = document.getElementById('note-modal-backdrop');
      var titleEl = document.getElementById('note-modal-title');
      var descEl = document.getElementById('note-modal-desc');
      var linkEl = document.getElementById('note-modal-link');

      function openModal(title, desc, href) {
        titleEl.textContent = title;
        descEl.textContent = desc;
        linkEl.setAttribute('href', href);
        backdrop.classList.add('is-open');
      }

      function closeModal() {
        backdrop.classList.remove('is-open');
      }

      document.querySelectorAll('.bubble').forEach(function (btn) {
        btn.addEventListener('click', function () {
          openModal(btn.dataset.title, btn.dataset.desc, btn.dataset.href);
        });
      });

      backdrop.querySelector('.modal-close').addEventListener('click', closeModal);
      backdrop.addEventListener('click', function (e) {
        if (e.target === backdrop) closeModal();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeModal();
      });
    })();
  </script>

  <script>
    (function () {
      var canvas = document.getElementById('stellar-bg');
      var ctx = canvas.getContext('2d');
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function makeSpriteRGB(c) {
        var size = 64, s = document.createElement('canvas');
        s.width = s.height = size;
        var sctx = s.getContext('2d'), r = size / 2;
        var g = sctx.createRadialGradient(r, r, 0, r, r, r);
        g.addColorStop(0, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.95)');
        g.addColorStop(0.45, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0.5)');
        g.addColorStop(1, 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',0)');
        sctx.fillStyle = g;
        sctx.beginPath(); sctx.arc(r, r, r, 0, Math.PI * 2); sctx.fill();
        return s;
      }
      function rgbaStr(rgb, a) {
        return 'rgba(' + Math.round(rgb[0]) + ',' + Math.round(rgb[1]) + ',' + Math.round(rgb[2]) + ',' + Math.max(0, Math.min(1, a)) + ')';
      }
      function stamp(sprite, x, y, size, alpha) {
        var half = size / 2;
        ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
        ctx.drawImage(sprite, x - half, y - half, size, size);
        ctx.globalAlpha = 1;
      }

      var W = 0, H = 0;
      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      window.addEventListener('resize', resize);

      var pointer = { x: -9999, y: -9999 };
      window.addEventListener('pointermove', function (e) { pointer.x = e.clientX; pointer.y = e.clientY; });

      var layers = [], counts = [130, 85, 45], factors = [0.012, 0.028, 0.05];
      var starSprite = makeSpriteRGB([255, 255, 255]);
      var nebColors = [[118, 88, 188], [66, 138, 168], [186, 96, 148]];
      var nebulae, shooters = [], nextShooter = 2000 + Math.random() * 3000;
      var smoothX = 0, smoothY = 0;

      function seed() {
        layers = [];
        for (var L = 0; L < 3; L++) {
          var stars = [];
          for (var i = 0; i < counts[L]; i++) {
            stars.push({
              x: Math.random() * W, y: Math.random() * H,
              size: (L + 1) * 0.9 + Math.random() * 1.1,
              phase: Math.random() * Math.PI * 2,
              freq: 0.12 + Math.random() * 0.22
            });
          }
          layers.push({ stars: stars, parallax: factors[L] });
        }
        nebulae = nebColors.map(function (c) {
          return {
            x: Math.random() * W, y: Math.random() * H,
            size: Math.min(W, H) * (0.55 + Math.random() * 0.3),
            sprite: makeSpriteRGB(c),
            phase: Math.random() * Math.PI * 2,
            speed: 0.015 + Math.random() * 0.015
          };
        });
      }

      var last = performance.now();
      function frame(now) {
        var dt = Math.min(50, now - last);
        last = now;
        var running = !reduceMotion;

        ctx.clearRect(0, 0, W, H);

        var relX = pointer.x > -9000 ? (pointer.x - W / 2) / (W / 2) : 0;
        var relY = pointer.y > -9000 ? (pointer.y - H / 2) / (H / 2) : 0;
        smoothX += (relX - smoothX) * 0.04;
        smoothY += (relY - smoothY) * 0.04;

        nebulae.forEach(function (n) {
          if (running) n.phase += n.speed * dt * 0.001;
          var dx = Math.sin(n.phase) * 40, dy = Math.cos(n.phase * 0.7) * 30;
          stamp(n.sprite, n.x + dx, n.y + dy, n.size, 0.14);
        });

        layers.forEach(function (layer) {
          var px = smoothX * layer.parallax * W, py = smoothY * layer.parallax * H;
          layer.stars.forEach(function (s) {
            var twinkle = 0.55 + 0.45 * Math.sin(now * 0.001 * s.freq + s.phase);
            stamp(starSprite, s.x + px, s.y + py, s.size * 2.4, twinkle * 0.75);
          });
        });

        if (running) {
          nextShooter -= dt;
          if (nextShooter <= 0) {
            shooters.push({
              x: Math.random() * W * 0.6, y: Math.random() * H * 0.3,
              vx: 6 + Math.random() * 4, vy: 3 + Math.random() * 2,
              life: 0, maxLife: 500 + Math.random() * 300
            });
            nextShooter = 5000 + Math.random() * 6000;
          }
          shooters.forEach(function (s) { s.life += dt; s.x += s.vx * dt * 0.06; s.y += s.vy * dt * 0.06; });
          shooters = shooters.filter(function (s) { return s.life < s.maxLife; });
        }
        shooters.forEach(function (s) {
          var f = s.life / s.maxLife;
          var alpha = (1 - f) * 0.85;
          ctx.strokeStyle = rgbaStr([255, 255, 255], alpha);
          ctx.lineWidth = 1.6;
          ctx.beginPath(); ctx.moveTo(s.x - s.vx * 6, s.y - s.vy * 6); ctx.lineTo(s.x, s.y); ctx.stroke();
          stamp(starSprite, s.x, s.y, 6, alpha);
        });

        requestAnimationFrame(frame);
      }

      resize();
      seed();
      requestAnimationFrame(frame);
    })();
  </script>

  <script defer src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" id="MathJax-script"></script>

</body>
</html>
