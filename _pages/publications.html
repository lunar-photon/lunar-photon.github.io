---
layout: default
title: "Publications"
permalink: /publications/
---

<p>See also <a href="{{ site.author.googlescholar }}">Google Scholar</a> and <a href="{{ site.author.arxiv }}">arXiv</a>.</p>

<div class="entry-list">
  {% for post in site.publications reversed %}
    <div class="entry card">
      <span class="entry-year">{{ post.date | date: "%Y" }}</span>
      <div class="entry-body">
        {{ post.citation }}
        <span class="links"><a class="btn btn-sm" href="{{ post.paperurl }}">arXiv</a>{% if post.doi %} <a class="btn btn-sm" href="{{ post.doi }}">DOI</a>{% endif %}</span>
        <span class="venue">{{ post.excerpt }}</span>
      </div>
    </div>
  {% endfor %}
</div>
