---
layout: default
title: "Publications"
permalink: /publications/
---

<p>See also <a href="{{ site.author.googlescholar }}">Google Scholar</a> and <a href="{{ site.author.arxiv }}">arXiv</a>.</p>

<ol class="pub-list">
  {% for post in site.publications reversed %}
    <li>
      {{ post.citation }}
      <a href="{{ post.paperurl }}">[arXiv]</a>{% if post.doi %} <a href="{{ post.doi }}">[DOI]</a>{% endif %}
      <br><span class="venue">{{ post.excerpt }}</span>
    </li>
  {% endfor %}
</ol>
