---
layout: default
title: "Talks and presentations"
permalink: /talks/
---

<div class="entry-list">
  {% for post in site.talks reversed %}
    <div class="entry">
      <span class="entry-year">{{ post.date | date: "%Y" }}</span>
      <div class="entry-body">
        <em>{{ post.title }}</em>
        <span class="venue">{{ post.type }}, {{ post.venue }}{% if post.location %}, {{ post.location }}{% endif %}</span>
      </div>
    </div>
  {% endfor %}
</div>
