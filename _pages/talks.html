---
layout: default
title: "Talks and presentations"
permalink: /talks/
---

<ul class="talk-list">
  {% for post in site.talks reversed %}
    <li>
      {{ post.date | date: "%Y" }} &middot; <em>{{ post.title }}</em>
      <br><span class="venue">{{ post.type }}, {{ post.venue }}{% if post.location %}, {{ post.location }}{% endif %}</span>
    </li>
  {% endfor %}
</ul>
